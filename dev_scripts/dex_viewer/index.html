<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dex Viewer</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --panel2: #f8f7f4; --text: #1f1d1a; --muted: #77716a;
  --border: #e3dfd8; --accent: #c0392b; --ok: #2e8b57; --warn: #d68910; --bad: #c0392b;
  --bar: #e9e5de;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --panel: #212226; --panel2: #1b1c20; --text: #ebe8e3; --muted: #9a958d;
    --border: #33353b; --bar: #2d2f35;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }

/* Sidebar */
#side { width: 270px; flex: none; height: 100vh; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--panel); }
#side header { padding: 12px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
#side h1 { margin: 0; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
#side input, #side select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel2); }
#side label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
#reload { border: 1px solid var(--border); background: var(--panel2); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
#list { overflow-y: auto; flex: 1; padding: 4px 0; }
#list a { display: flex; align-items: center; gap: 8px; padding: 2px 12px; text-decoration: none; }
#list a:hover, #list a.active { background: var(--panel2); }
#list a .num { color: var(--muted); font-variant-numeric: tabular-nums; width: 30px; font-size: 12px; }
#list a .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#list canvas { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* Main */
#main { flex: 1; height: 100vh; overflow-y: auto; scroll-behavior: smooth; }
#summary { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 2; }
#summary .row { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
#summary .big { font-size: 18px; font-weight: 600; }
.pbar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; min-width: 70px; }
.pbar > div { height: 100%; background: var(--ok); }
.metric { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 110px; }
#cards { padding: 16px 24px 60vh; display: grid; gap: 16px; max-width: 1200px; }
#status { padding: 40px; color: var(--muted); }
#status.err { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: grid; grid-template-columns: 200px 1fr; gap: 16px 24px; scroll-margin-top: 110px; }
.card .head { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.card h2 { margin: 0; font-size: 20px; }
.card .no { color: var(--muted); font-variant-numeric: tabular-nums; }
.card .const { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
.card .spr { display: grid; gap: 8px; justify-items: center; align-content: start; }
.card .spr .box { width: 192px; height: 192px; background: var(--panel2); border-radius: 8px; display: grid; place-items: center; }
.card .spr canvas { width: 192px; height: 192px; image-rendering: pixelated; }
.card .spr .tog { display: flex; gap: 4px; }
.card .spr .tog button { border: 1px solid var(--border); background: var(--panel2); border-radius: 5px; padding: 1px 8px; font-size: 12px; cursor: pointer; }
.card .spr .tog button.on { background: var(--text); color: var(--panel); }
.card .body { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px 24px; align-content: start; }
.card h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.card .wide { grid-column: 1 / -1; }
.desc { font-style: italic; color: var(--muted); white-space: pre-line; margin: 0; }

.type { display: inline-block; padding: 1px 8px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.cat { display: inline-block; font-size: 11px; color: var(--muted); }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { padding: 2px 6px; text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
tr + tr td { border-top: 1px solid var(--border); }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.stats td:first-child { width: 70px; color: var(--muted); }
.stats td.v { width: 36px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.stats .sbar { height: 8px; border-radius: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.moves { max-height: 340px; overflow-y: auto; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--border); }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.chip.ko { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.chip.info { color: var(--muted); }
.warn { color: var(--warn); font-size: 13px; margin: 2px 0; }
.evo a { cursor: pointer; text-decoration: underline dotted; }
.missing { color: var(--bad); }
.muted { color: var(--muted); }

@media (max-width: 800px) {
  body { flex-direction: column; }
  #side { width: 100%; height: auto; max-height: 40vh; }
  #main { height: auto; }
  .card { grid-template-columns: 1fr; }
  #cards, #summary { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<nav id="side">
  <header>
    <h1>Dex Viewer <button id="reload" title="Relire les sources">↻ Recharger</button></h1>
    <input id="q" type="search" placeholder="Rechercher (nom, type, capacité, talent…)">
    <select id="ftype"><option value="">Tous les types</option></select>
    <select id="fstate">
      <option value="">Tous</option>
      <option value="done">Complets</option>
      <option value="todo">Incomplets</option>
      <option value="untouched">Non commencés (placeholder)</option>
    </select>
  </header>
  <div id="list"></div>
</nav>
<main id="main">
  <div id="summary"></div>
  <div id="status">Chargement des sources…</div>
  <div id="cards"></div>
</main>

<script>
// Paths are relative to the repo root (served by serve.sh).
const ROOT = '../../';
const SRC = {
  species: 'src/data/pokemon/species_info.h',
  pokedex: 'include/constants/pokedex.h',
  gfx: 'src/data/graphics/pokemon.h',
  moves: 'src/data/moves_info.h',
  abilities: 'src/data/abilities.h',
  teachable: 'src/data/pokemon/teachable_learnsets.h',
  wild: 'src/data/wild_encounters.json',
  levelUp: [1, 2, 3, 4, 5, 6, 7, 8, 9].map(g => `src/data/pokemon/level_up_learnsets/gen_${g}.h`),
};

const TYPES = {
  NORMAL: ['Normal', '#9fa19f'], FIRE: ['Feu', '#e62829'], WATER: ['Eau', '#2980ef'], GRASS: ['Plante', '#3fa129'],
  ELECTRIC: ['Électrik', '#fac000'], ICE: ['Glace', '#3dcef3'], FIGHTING: ['Combat', '#ff8000'], POISON: ['Poison', '#9141cb'],
  GROUND: ['Sol', '#915121'], FLYING: ['Vol', '#81b9ef'], PSYCHIC: ['Psy', '#ef4179'], BUG: ['Insecte', '#91a119'],
  ROCK: ['Roche', '#afa981'], GHOST: ['Spectre', '#704170'], DRAGON: ['Dragon', '#5060e1'], DARK: ['Ténèbres', '#624d4e'],
  STEEL: ['Acier', '#60a1b8'], FAIRY: ['Fée', '#ef70ef'], STELLAR: ['Stellaire', '#40b5a5'], MYSTERY: ['???', '#68a090'],
};
const STATS = [['baseHP', 'PV'], ['baseAttack', 'Attaque'], ['baseDefense', 'Défense'], ['baseSpAttack', 'Atq. Spé'], ['baseSpDefense', 'Déf. Spé'], ['baseSpeed', 'Vitesse']];
const EV_LABELS = { HP: 'PV', Attack: 'Atq', Defense: 'Déf', SpAttack: 'Atq.Spé', SpDefense: 'Déf.Spé', Speed: 'Vit' };
const CHECKS = [
  ['stats', 'Stats'], ['infos', 'Infos (talents, capture…)'], ['dex', 'Taille/poids'],
  ['desc', 'Description'], ['learnset', 'Learnset'], ['teach', 'CT/Tuteurs'], ['shiny', 'Palette shiny'],
];

// ---------- C parsing helpers ----------

async function fetchText(path) {
  const r = await fetch(ROOT + path, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.text();
}

function stripComments(s) {
  return s.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\n]*/g, '');
}

// Splits on commas at nesting depth 0, ignoring commas inside strings.
function splitTop(s) {
  const out = []; let depth = 0, cur = '', str = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (str) { cur += c; if (c === '\\') { cur += s[++i]; } else if (c === '"') str = false; continue; }
    if (c === '"') { str = true; cur += c; continue; }
    if ('({['.includes(c)) depth++;
    if (')}]'.includes(c)) depth--;
    if (c === ',' && depth === 0) { out.push(cur); cur = ''; continue; }
    cur += c;
  }
  if (cur.trim()) out.push(cur);
  return out;
}

// Parses the body of a designated initializer into { field: rawValue }, plus duplicated field names.
function parseFields(body) {
  const fields = {}, dups = [];
  body = body.split('\n').filter(l => !/^\s*#/.test(l)).join('\n');
  for (const seg of splitTop(body)) {
    const m = seg.match(/\.(\w+)\s*=\s*([\s\S]*)$/);
    if (!m) continue;
    if (m[1] in fields) dups.push(m[1]);
    fields[m[1]] = m[2].trim();
  }
  return { fields, dups };
}

function cString(raw) {
  if (!raw) return '';
  const parts = [...raw.matchAll(/"((?:[^"\\]|\\.)*)"/g)].map(m => m[1]);
  return parts.join('').replace(/\\n/g, '\n').replace(/\\p/g, '\n').replace(/\\l/g, '\n').replace(/\\"/g, '"');
}

function args(raw) {
  const m = raw && raw.match(/^\w*\s*[({]([\s\S]*)[)}]$/);
  return m ? splitTop(m[1]).map(s => s.trim()) : [];
}

function num(raw) {
  if (raw == null) return null;
  const tern = raw.match(/\?\s*(-?\d+)\s*:/);
  if (tern) return +tern[1];
  const m = raw.match(/-?\d+/);
  return m ? +m[0] : null;
}

function humanize(c, prefix) {
  if (!c) return '';
  return c.replace(prefix, '').toLowerCase().split('_').map(w => w[0]?.toUpperCase() + w.slice(1)).join(' ');
}

// Parses `[KEY] = { ... }` blocks at the given indentation into a map.
function parseBlocks(text, keyPrefix) {
  const out = {};
  const re = new RegExp(`^    \\[(${keyPrefix}\\w+)\\]\\s*=\\s*\\{([\\s\\S]*?)^    \\},?`, 'gm');
  for (const m of text.matchAll(re)) out[m[1]] = m[2];
  return out;
}

function parseArrays(text, re) {
  const out = {};
  for (const m of text.matchAll(re)) out[m[1]] = m[2];
  return out;
}

// ---------- Data loading ----------

async function loadAll() {
  const [species, pokedex, gfx, moves, abilities, teachable, wild, ...levelUp] = await Promise.all([
    SRC.species, SRC.pokedex, SRC.gfx, SRC.moves, SRC.abilities, SRC.teachable, SRC.wild, ...SRC.levelUp,
  ].map(fetchText));

  // Custom species only: everything after the commented-out template.
  let custom = species;
  const marker = species.indexOf('You may add any custom species below this point');
  if (marker >= 0) custom = species.slice(species.indexOf('*/', species.indexOf('*/', marker) + 2) + 2);
  custom = stripComments(custom);

  const mons = [];
  const heads = [...custom.matchAll(/^\s*\[(SPECIES_\w+)\]\s*=\s*\{/gm)];
  heads.forEach((h, i) => {
    const end = i + 1 < heads.length ? heads[i + 1].index : custom.lastIndexOf('};');
    let body = custom.slice(h.index + h[0].length, end).trim().replace(/\}\s*,?\s*(\}\s*;)?\s*$/, '');
    const { fields, dups } = parseFields(body);
    mons.push({ id: h[1], f: fields, dups });
  });

  // Regional (Hoenn) dex order.
  const order = {};
  const hoenn = pokedex.match(/enum HoennDexOrder\s*\{([\s\S]*?)\}/);
  if (hoenn) [...hoenn[1].matchAll(/HOENN_DEX_(\w+)/g)].forEach((m, i) => { if (!(('SPECIES_' + m[1]) in order)) order['SPECIES_' + m[1]] = i; });

  const gfxPaths = {};
  for (const m of gfx.matchAll(/(gMon\w+)\[\]\s*=\s*INCBIN_U\d+\("([^"]+)"\)/g)) gfxPaths[m[1]] = m[2];

  const moveData = {};
  for (const [k, b] of Object.entries(parseBlocks(moves, 'MOVE_'))) {
    const { fields } = parseFields(stripComments(b));
    moveData[k] = {
      name: cString(fields.name) || humanize(k, 'MOVE_'),
      type: (fields.type || '').replace('TYPE_', ''),
      power: num(fields.power) || 0,
      acc: num(fields.accuracy) || 0,
      pp: num(fields.pp) || 0,
      cat: (fields.category || '').replace('DAMAGE_CATEGORY_', ''),
    };
  }
  const abilityData = {};
  for (const [k, b] of Object.entries(parseBlocks(abilities, 'ABILITY_'))) {
    const { fields } = parseFields(stripComments(b));
    abilityData[k] = { name: cString(fields.name) || humanize(k, 'ABILITY_'), desc: cString(fields.description) };
  }

  const lvlSets = {};
  for (const t of levelUp) {
    Object.assign(lvlSets, parseArrays(t, /static const struct LevelUpMove (\w+)\[\]\s*=\s*\{([\s\S]*?)\};/g));
  }
  const teachSets = parseArrays(teachable, /static const u16 (\w+)\[\]\s*=\s*\{([\s\S]*?)\};/g);

  const encounters = {};
  try {
    for (const group of JSON.parse(wild).wild_encounter_groups) {
      for (const enc of group.encounters || []) {
        for (const [key, v] of Object.entries(enc)) {
          if (!v || !Array.isArray(v.mons)) continue;
          const method = key.replace('_mons', '');
          for (const mon of v.mons) {
            const list = (encounters[mon.species] ||= {});
            const k = `${enc.map || enc.base_label}|${method}`;
            const e = (list[k] ||= { map: enc.map || enc.base_label, method, min: 999, max: 0, slots: 0 });
            e.min = Math.min(e.min, mon.min_level); e.max = Math.max(e.max, mon.max_level); e.slots++;
          }
        }
      }
    }
  } catch (e) { console.warn('wild_encounters.json', e); }

  const res = buildMons(mons, { order, gfxPaths, moveData, abilityData, lvlSets, teachSets, encounters });
  await Promise.all(res.mons.map(async m => {
    const [a, b] = await Promise.all([m.img.pal && loadPal(m.img.pal), m.img.shiny && loadPal(m.img.shiny)]);
    m.checks.shiny = !!(a && b) && JSON.stringify(a) !== JSON.stringify(b);
    m.score = Object.values(m.checks).filter(Boolean).length / CHECKS.length;
  }));
  return res;
}

function buildMons(raw, db) {
  const byId = {};
  const mons = raw.map((r, idx) => {
    const f = r.f;
    const m = { id: r.id, warnings: r.dups.map(d => `Champ .${d} défini plusieurs fois (la dernière valeur gagne)`) };
    m.name = cString(f.speciesName) || humanize(r.id, 'SPECIES_');
    m.dexNo = r.id in db.order ? db.order[r.id] + 1 : null;
    m.sortKey = m.dexNo ?? 10000 + idx;
    m.stats = Object.fromEntries(STATS.map(([k]) => [k, num(f[k]) ?? 0]));
    m.bst = Object.values(m.stats).reduce((a, b) => a + b, 0);
    m.types = [...new Set(args(f.types).map(t => t.replace('TYPE_', '')))];
    m.abilities = args(f.abilities);
    m.catchRate = num(f.catchRate);
    m.expYield = num(f.expYield);
    m.evs = Object.entries(f).filter(([k]) => k.startsWith('evYield_')).map(([k, v]) => `${num(v)} ${EV_LABELS[k.slice(8)] || k.slice(8)}`);
    m.gender = f.genderRatio || '';
    m.eggCycles = num(f.eggCycles);
    m.friendship = f.friendship;
    m.growth = humanize(f.growthRate, 'GROWTH_');
    m.eggGroups = [...new Set(args(f.eggGroups).map(g => humanize(g, 'EGG_GROUP_')))];
    m.category = cString(f.categoryName);
    m.height = num(f.height); m.weight = num(f.weight);
    m.desc = cString(f.description);
    m.evolutions = args(f.evolutions).map(e => args(e)).filter(a => a.length >= 3)
      .map(a => ({ method: a[0], param: a[1], target: a[2], extra: a.slice(3) }));

    const gfx = sym => {
      const p = sym && db.gfxPaths[sym.trim()];
      return p ? p.replace(/\.(4bpp|8bpp|gbapal)(\.\w+)?$/, (_, kind) => kind === 'gbapal' ? '.pal' : '.png') : null;
    };
    m.iconPal = `graphics/pokemon/icon_palettes/pal${num(f.iconPalIndex) ?? 0}.pal`;
    m.img = { front: gfx(f.frontPic), back: gfx(f.backPic), icon: gfx(f.iconSprite), pal: gfx(f.palette), shiny: gfx(f.shinyPalette) };

    if (f.levelUpLearnset) {
      const sym = f.levelUpLearnset.trim(), body = db.lvlSets[sym];
      if (body == null) m.warnings.push(`Learnset ${sym} introuvable`);
      m.levelUp = body == null ? null : [...body.matchAll(/LEVEL_UP_MOVE\(\s*(\d+)\s*,\s*(MOVE_\w+)\s*\)/g)].map(x => ({ lvl: +x[1], move: x[2] }));
    }
    if (f.teachableLearnset) {
      const sym = f.teachableLearnset.trim(), body = db.teachSets[sym];
      if (body == null) m.warnings.push(`Teachable ${sym} introuvable (relancer make pour régénérer ?)`);
      m.teach = body == null ? null : [...body.matchAll(/MOVE_\w+/g)].map(x => x[0]).filter(x => x !== 'MOVE_UNAVAILABLE');
    }
    m.wild = Object.values(db.encounters[r.id] || {});
    for (const mv of [...(m.levelUp || []).map(x => x.move), ...(m.teach || [])]) {
      if (!db.moveData[mv]) m.warnings.push(`Capacité inconnue: ${mv}`);
    }
    for (const a of m.abilities) if (a !== 'ABILITY_NONE' && !db.abilityData[a]) m.warnings.push(`Talent inconnu: ${a}`);

    const placeholderStats = Object.values(m.stats).every(v => v === 10);
    m.checks = {
      stats: !placeholderStats && m.bst > 0,
      infos: m.catchRate !== 3 && !(m.abilities[0] === 'ABILITY_STENCH' && m.abilities.slice(1).every(a => a === 'ABILITY_NONE')),
      dex: !(m.height === 10 && m.weight === 10) && !!m.height && !!m.weight,
      desc: !!m.desc && !/^\s*placeholder\.?\s*$/i.test(m.desc),
      learnset: !!(m.levelUp && m.levelUp.length),
      teach: !!(m.teach && m.teach.length),
    };
    m.untouched = placeholderStats && !m.checks.learnset;
    m.searchText = [m.name, r.id, ...m.types.map(t => TYPES[t]?.[0] || t), ...m.abilities.map(a => db.abilityData[a]?.name || a),
      ...(m.levelUp || []).map(x => db.moveData[x.move]?.name || x.move), m.category].join(' ').toLowerCase();
    byId[r.id] = m;
    return m;
  });
  for (const m of mons) {
    m.evolutions.forEach(e => {
      if (byId[e.target]) (byId[e.target].preEvos ||= []).push({ from: m.id, method: e.method, param: e.param });
      else if (e.target !== 'SPECIES_NONE') m.warnings.push(`Évolution vers ${e.target} : espèce hors dex custom`);
    });
  }
  mons.sort((a, b) => a.sortKey - b.sortKey);
  return { mons, byId, db };
}

// ---------- Sprites ----------

// Decodes an indexed (color type 3, non-interlaced) PNG into palette indices, like the GBA sees it.
const imgCache = {};
function loadIndexed(path) {
  return imgCache[path] ||= (async () => {
    const r = await fetch(ROOT + path, { cache: 'no-store' });
    if (!r.ok) throw new Error(path);
    const buf = new Uint8Array(await r.arrayBuffer()), dv = new DataView(buf.buffer);
    let w, h, depth, type, interlace, plte = [];
    const idat = [];
    for (let p = 8; p < buf.length;) {
      const len = dv.getUint32(p), name = String.fromCharCode(...buf.subarray(p + 4, p + 8)), d = buf.subarray(p + 8, p + 8 + len);
      if (name === 'IHDR') { w = dv.getUint32(p + 8); h = dv.getUint32(p + 12); depth = d[8]; type = d[9]; interlace = d[12]; }
      else if (name === 'PLTE') for (let i = 0; i < len; i += 3) plte.push([d[i], d[i + 1], d[i + 2]]);
      else if (name === 'IDAT') idat.push(d);
      p += 12 + len;
    }
    if (type !== 3 || interlace) throw new Error(`${path}: PNG non indexé`);
    const raw = new Uint8Array(await new Response(new Blob(idat).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
    const stride = Math.ceil(w * depth / 8), bpp = 1, out = new Uint8Array(stride * h);
    for (let y = 0; y < h; y++) {
      const f = raw[y * (stride + 1)], src = raw.subarray(y * (stride + 1) + 1, (y + 1) * (stride + 1));
      const cur = out.subarray(y * stride, (y + 1) * stride), prev = y ? out.subarray((y - 1) * stride, y * stride) : new Uint8Array(stride);
      for (let x = 0; x < stride; x++) {
        const a = x >= bpp ? cur[x - bpp] : 0, b = prev[x], c = x >= bpp ? prev[x - bpp] : 0;
        let v = src[x];
        if (f === 1) v += a; else if (f === 2) v += b; else if (f === 3) v += (a + b) >> 1;
        else if (f === 4) { const pp = a + b - c, pa = Math.abs(pp - a), pb = Math.abs(pp - b), pc = Math.abs(pp - c); v += pa <= pb && pa <= pc ? a : pb <= pc ? b : c; }
        cur[x] = v;
      }
    }
    const idx = new Uint8Array(w * h), per = 8 / depth, mask = (1 << depth) - 1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const byte = out[y * stride + Math.floor(x / per)];
      idx[y * w + x] = (byte >> (8 - depth * (x % per + 1))) & mask;
    }
    return { w, h, idx, plte };
  })().catch(e => { delete imgCache[path]; throw e; }); // don't cache failures (e.g. server restarted)
}
const palCache = {};
function loadPal(path) {
  return palCache[path] ||= fetchText(path).then(t => t.split(/\r?\n/).slice(3).filter(l => l.trim()).map(l => l.trim().split(/\s+/).map(Number))).catch(() => { delete palCache[path]; return null; });
}

// Draws the top-left w×h frame with the given JASC palette (index 0 = transparent, as in game).
async function drawSprite(canvas, path, w, h, palPath) {
  const ctx = canvas.getContext('2d');
  canvas.width = w; canvas.height = h;
  ctx.clearRect(0, 0, w, h);
  if (!path) return false;
  try {
    const [img, pal] = await Promise.all([loadIndexed(path), palPath ? loadPal(palPath) : null]);
    const colors = pal || img.plte;
    const data = ctx.createImageData(w, h), px = data.data;
    for (let y = 0; y < Math.min(h, img.h); y++) for (let x = 0; x < Math.min(w, img.w); x++) {
      const i = img.idx[y * img.w + x], o = (y * w + x) * 4, c = colors[i] || [255, 0, 255];
      px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2]; px[o + 3] = i === 0 ? 0 : 255;
    }
    ctx.putImageData(data, 0, 0);
    return true;
  } catch (e) {
    console.warn('Sprite non chargé :', e.message);
    canvas.title = `Sprite non chargé : ${e.message}`;
    ctx.fillStyle = '#c0392b'; ctx.font = `bold ${w / 2}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', w / 2, h / 2);
    return false;
  }
}

// ---------- Rendering ----------

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let state = null;

const typeBadge = t => `<span class="type" style="background:${TYPES[t]?.[1] || '#888'}">${esc(TYPES[t]?.[0] || t)}</span>`;
const statColor = v => `hsl(${Math.min(v, 160) * 0.85}, 65%, 48%)`;
const scoreColor = s => s >= 1 ? 'var(--ok)' : s > 0.34 ? 'var(--warn)' : 'var(--bad)';
const fmtNo = n => n == null ? '—' : String(n).padStart(3, '0');

function genderText(g) {
  if (g === 'MON_GENDERLESS') return 'Asexué';
  if (g === 'MON_MALE') return '100% ♂';
  if (g === 'MON_FEMALE') return '100% ♀';
  const p = num(g);
  return p == null ? g : `${100 - p}% ♂ / ${p}% ♀`;
}

function evoText(e) {
  const p = e.param;
  switch (e.method) {
    case 'EVO_LEVEL': return `N. ${p}`;
    case 'EVO_ITEM': return humanize(p, 'ITEM_');
    case 'EVO_TRADE': return 'Échange';
    case 'EVO_FRIENDSHIP': return 'Bonheur';
    default: return `${humanize(e.method, 'EVO_')}${p && p !== '0' ? ' ' + humanize(p, /^[A-Z]+_/) : ''}`;
  }
}

function moveRow(db, mv, lvl) {
  const d = db.moveData[mv];
  if (!d) return `<tr>${lvl != null ? `<td class="n">${lvl}</td>` : ''}<td class="missing" colspan="6">${esc(mv)}</td></tr>`;
  const cat = { PHYSICAL: 'Phys.', SPECIAL: 'Spé.', STATUS: 'Statut' }[d.cat] || d.cat;
  return `<tr>${lvl != null ? `<td class="n">${lvl === 0 ? 'Évo' : lvl}</td>` : ''}<td>${esc(d.name)}</td><td>${typeBadge(d.type)}</td>
    <td class="cat">${cat}</td><td class="n">${d.power > 1 ? d.power : '—'}</td><td class="n">${d.acc || '—'}</td><td class="n">${d.pp}</td></tr>`;
}

function renderCard(m) {
  const { db, byId } = state;
  const link = id => byId[id] ? `<a data-goto="${id}">${esc(byId[id].name)}</a>` : `<span class="missing">${esc(id)}</span>`;
  const abil = m.abilities.map((a, i) => a === 'ABILITY_NONE' ? '' :
    `<div title="${esc(db.abilityData[a]?.desc)}">${esc(db.abilityData[a]?.name || a)}${i === 2 ? ' <span class="muted">(caché)</span>' : ''}</div>`).join('');
  const moveHead = lvl => `<tr>${lvl ? '<th>Niv.</th>' : ''}<th>Capacité</th><th>Type</th><th>Cat.</th><th>Puiss.</th><th>Préc.</th><th>PP</th></tr>`;
  const teachSorted = (m.teach || []).slice().sort((a, b) => (db.moveData[a]?.name || a).localeCompare(db.moveData[b]?.name || b));

  return `
  <article class="card" id="${m.id}">
    <div class="head">
      <span class="no">#${fmtNo(m.dexNo)}</span><h2>${esc(m.name)}</h2>
      ${m.types.map(typeBadge).join(' ')}
      <span class="const">${m.id}</span>
      <span style="flex:1"></span>
      <div class="pbar" style="width:120px" title="${Math.round(m.score * 100)}%"><div style="width:${m.score * 100}%;background:${scoreColor(m.score)}"></div></div>
    </div>
    <div class="spr">
      <div class="box"><canvas data-sprite="front" width="64" height="64"></canvas></div>
      <div class="tog">
        <button data-view="front" class="on">Face</button><button data-view="back">Dos</button><button data-shiny>Shiny</button>
      </div>
      <div class="muted" style="font-size:12px">${esc(m.category)}${m.category ? ' · ' : ''}${m.height != null ? m.height / 10 + ' m' : '?'} · ${m.weight != null ? m.weight / 10 + ' kg' : '?'}</div>
    </div>
    <div class="body">
      <div>
        <h3>Stats de base</h3>
        <table class="stats">
          ${STATS.map(([k, l]) => `<tr><td>${l}</td><td class="v">${m.stats[k]}</td><td><div class="sbar" style="width:${Math.min(100, m.stats[k] / 1.8)}%;background:${statColor(m.stats[k])}"></div></td></tr>`).join('')}
          <tr><td>Total</td><td class="v">${m.bst}</td><td></td></tr>
        </table>
      </div>
      <div>
        <h3>Talents</h3>${abil || '<span class="muted">—</span>'}
        <h3 style="margin-top:12px">Infos</h3>
        <dl class="kv">
          <dt>Capture</dt><dd>${m.catchRate ?? '?'}</dd>
          <dt>Exp.</dt><dd>${m.expYield ?? '?'} · ${esc(m.growth)}</dd>
          <dt>EV</dt><dd>${esc(m.evs.join(', ') || '—')}</dd>
          <dt>Sexe</dt><dd>${esc(genderText(m.gender))}</dd>
          <dt>Œufs</dt><dd>${esc(m.eggGroups.join(', '))} · ${m.eggCycles ?? '?'} cycles</dd>
        </dl>
      </div>
      <div class="wide">
        <h3>Pokédex</h3>
        <p class="desc">${esc(m.desc) || '—'}</p>
      </div>
      <div class="evo">
        <h3>Évolutions</h3>
        ${(m.preEvos || []).map(p => `<div>← ${link(p.from)} <span class="muted">(${esc(evoText(p))})</span></div>`).join('')}
        ${m.evolutions.map(e => `<div>→ ${link(e.target)} <span class="muted">(${esc(evoText(e))})</span></div>`).join('')}
        ${!m.preEvos && !m.evolutions.length ? '<span class="muted">N\'évolue pas</span>' : ''}
      </div>
      <div>
        <h3>Rencontres sauvages</h3>
        ${m.wild.length ? m.wild.map(w => `<div>${esc(humanize(w.map, 'MAP_'))} <span class="muted">· ${esc(w.method)} · N.${w.min}${w.max !== w.min ? '–' + w.max : ''} · ${w.slots} slot${w.slots > 1 ? 's' : ''}</span></div>`).join('') : '<span class="muted">Aucune</span>'}
      </div>
      <div class="wide">
        <h3>Avancement</h3>
        <div class="checks">${CHECKS.map(([k, l]) => `<span class="chip ${m.checks[k] ? 'ok' : 'ko'}">${m.checks[k] ? '✓' : '✗'} ${l}</span>`).join('')}</div>
        ${m.warnings.map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join('')}
      </div>
      <div class="wide">
        <h3>Capacités par niveau ${m.levelUp ? `<span class="muted">(${m.levelUp.length})</span>` : ''}</h3>
        ${m.levelUp ? `<div class="moves"><table>${moveHead(true)}${m.levelUp.map(x => moveRow(db, x.move, x.lvl)).join('')}</table></div>` : '<span class="missing">Pas de levelUpLearnset</span>'}
      </div>
      <div class="wide">
        ${m.teach ? `<details><summary>CT / Tuteurs (${m.teach.length})</summary><div class="moves"><table>${moveHead(false)}${teachSorted.map(x => moveRow(db, x)).join('')}</table></div></details>`
          : '<h3>CT / Tuteurs</h3><span class="missing">Pas de teachableLearnset</span>'}
      </div>
    </div>
  </article>`;
}

function renderSummary(mons) {
  const all = state.mons;
  const done = all.filter(m => m.score >= 1).length;
  const untouched = all.filter(m => m.untouched).length;
  const avg = all.reduce((a, m) => a + m.score, 0) / all.length;
  $('#summary').innerHTML = `
    <div class="row">
      <span class="big">${done} / ${all.length} complets</span>
      <div class="pbar" style="width:200px"><div style="width:${avg * 100}%"></div></div>
      <span class="muted">${Math.round(avg * 100)}% global · ${untouched} non commencés · ${mons.length} affichés</span>
    </div>
    <div class="row" style="margin-top:10px">
      ${CHECKS.map(([k, l]) => {
        const n = all.filter(m => m.checks[k]).length;
        return `<div class="metric"><span>${l} · ${n}/${all.length}</span><div class="pbar"><div style="width:${n / all.length * 100}%"></div></div></div>`;
      }).join('')}
    </div>`;
}

function filtered() {
  const q = $('#q').value.trim().toLowerCase(), t = $('#ftype').value, s = $('#fstate').value;
  return state.mons.filter(m =>
    (!q || q.split(/\s+/).every(w => m.searchText.includes(w))) &&
    (!t || m.types.includes(t)) &&
    (!s || (s === 'done' ? m.score >= 1 : s === 'todo' ? m.score < 1 : m.untouched)));
}

let observer;
function render() {
  const mons = filtered();
  renderSummary(mons);
  $('#list').innerHTML = mons.map(m => `<a href="#${m.id}" data-id="${m.id}"><span class="num">${fmtNo(m.dexNo)}</span><canvas data-icon width="32" height="32"></canvas><span class="nm">${esc(m.name)}</span><span class="dot" style="background:${scoreColor(m.score)}" title="${Math.round(m.score * 100)}%"></span></a>`).join('');
  $('#cards').innerHTML = mons.map(renderCard).join('') || '<p class="muted">Aucun résultat.</p>';

  observer?.disconnect();
  observer = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      observer.unobserve(e.target);
      const el = e.target, m = state.byId[el.dataset.id || el.id];
      if (el.matches('a')) drawSprite(el.querySelector('canvas'), m.img.icon, 32, 32, m.iconPal);
      else paintCard(el, m);
    }
  }, { root: null, rootMargin: '400px' });
  document.querySelectorAll('#list a, .card').forEach(el => observer.observe(el));
}

function paintCard(el, m) {
  const view = el.querySelector('[data-view].on').dataset.view;
  const shiny = el.querySelector('[data-shiny]').classList.contains('on');
  drawSprite(el.querySelector('[data-sprite]'), m.img[view], 64, 64, shiny ? m.img.shiny : m.img.pal);
}

document.addEventListener('click', e => {
  const goto = e.target.closest('[data-goto]');
  if (goto) { document.getElementById(goto.dataset.goto)?.scrollIntoView(); return; }
  const btn = e.target.closest('.tog button');
  if (btn) {
    const card = btn.closest('.card');
    if (btn.dataset.view) card.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b === btn));
    else btn.classList.toggle('on');
    paintCard(card, state.byId[card.id]);
  }
});

// Highlights the sidebar entry of the card currently at the top.
$('#main').addEventListener('scroll', () => {
  const cards = [...document.querySelectorAll('.card')];
  const cur = cards.find(c => c.getBoundingClientRect().bottom > 140);
  document.querySelectorAll('#list a.active').forEach(a => a.classList.remove('active'));
  const a = cur && document.querySelector(`#list a[data-id="${cur.id}"]`);
  if (a) { a.classList.add('active'); a.scrollIntoView({ block: 'nearest' }); }
}, { passive: true });

['#q', '#ftype', '#fstate'].forEach(s => $(s).addEventListener('input', render));

async function boot() {
  const anchor = location.hash.slice(1);
  $('#status').className = ''; $('#status').textContent = 'Chargement des sources…'; $('#status').hidden = false;
  try {
    for (const k in imgCache) delete imgCache[k];
    for (const k in palCache) delete palCache[k];
    state = await loadAll();
    const types = [...new Set(state.mons.flatMap(m => m.types))].sort((a, b) => (TYPES[a]?.[0] || a).localeCompare(TYPES[b]?.[0] || b));
    const cur = $('#ftype').value;
    $('#ftype').innerHTML = '<option value="">Tous les types</option>' + types.map(t => `<option value="${t}">${TYPES[t]?.[0] || t}</option>`).join('');
    $('#ftype').value = cur;
    $('#status').hidden = true;
    render();
    if (anchor) document.getElementById(anchor)?.scrollIntoView({ behavior: 'instant' });
  } catch (e) {
    console.error(e);
    $('#status').className = 'err';
    $('#status').textContent = `Impossible de lire les sources : ${e.message}\n\n` +
      (location.protocol === 'file:' ? 'La page est ouverte en file:// — lance plutôt :\n  ./dev_scripts/dex_viewer/serve.sh' : '');
  }
}
$('#reload').addEventListener('click', boot);
boot();
</script>
</body>
</html>
